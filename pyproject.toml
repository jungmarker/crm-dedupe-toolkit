[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-dedupe-toolkit"
version = "0.1.0"
description = "Explainable CRM duplicate detection, survivorship and merge planning"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy", "rapidfuzz>=3.0", "pyarrow", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest", "ledgerly-data @ git+https://github.com/jungmarker/ledgerly-data.git"]

[project.scripts]
crm-dedupe = "crmdedupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
